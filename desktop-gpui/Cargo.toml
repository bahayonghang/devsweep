[workspace]

[package]
name = "devsweep-gpui-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "DevSweep native Windows GPUI feasibility spike"

# One Zed commit for gpui, gpui_platform, and gpui_windows.
# Do not use a branch, a "*" version, or crates.io gpui 0.2.2.
[dependencies]
anyhow = "1.0.104"
devsweep-core = { path = "../crates/devsweep-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad" }
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad" }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "=0.62.2", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
sha2 = "0.11.1"

[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }
