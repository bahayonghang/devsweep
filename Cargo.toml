[package]
name = "devsweep"
version = "0.1.0"
edition = "2024"
description = "A safety-first developer cleanup planner and executor."
license = "MIT"
repository = "https://github.com/bahayonghang/devsweep"
readme = "README.md"
rust-version = "1.85.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "process_fixture"
path = "src/bin/process_fixture.rs"
doc = false

[profile.release]
lto = true
codegen-units = 1
strip = true
