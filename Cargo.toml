[package]
name = "devsweep"
version = "0.1.0"
edition = "2024"
description = "A safety-first developer cleanup planner and executor."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
